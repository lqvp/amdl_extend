# "Is the code correct?": `pytest` for `hub/`, `go test` for `hub-go/`.
#
# Deliberately its own workflow rather than a job inside build.yml, because the two answer
# different questions at very different costs: this one asks "is the code correct?" and
# answers in about 70 seconds, while build.yml asks "does the image exist?" and pays for a
# 691 MB NDK download to find out. One workflow would put an image build between a
# contributor and a red X on a one-line logic bug.
#
# Two jobs in the one workflow rather than two workflows: both ask that same question at
# about the same cost -- each is well under two minutes -- and one concurrency group below
# cancels the pair together when a newer push lands. What they do *not* share is setup. The
# Python suite cannot run without the uv environment and the vendor tree, and the first
# step below spends most of its lines fetching the latter. The Go suite needs neither: the
# goldens it compares against are committed and its whole dependency list is the standard
# library.
#
# Nothing here reads compose.yaml, and that is a requirement rather than an omission.
# compose.yaml carries `${AMD_LIBRARY_HOST:?...}` on the library bind and
# `${AMD_PASSWORD:?...}` on the login password, and compose interpolates the *whole* file
# at load time -- before it looks at what the build block needs -- so a runner with no
# `.env` cannot even parse it. This workflow needs nothing from the deployment and should
# not pay for it. build.yml does need the file and therefore defines the two placeholders
# itself, with a comment saying why they are harmless.

name: test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# A run superseded by a newer push to the same PR is work nobody will read. Cancel it --
# and only that: there is no publish here to protect, so cancelling is free.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Read-only, stated even though it is close to the default. This workflow writes nothing,
# and `contents: read` is the whole token a compromised dependency in the test run gets.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A hang has to cost minutes, not the runner's default six hours. The suite is 49.91 s
    # on a laptop and its slowest single test is 5.08 s, so even a cold uv sync plus a slow
    # runner leaves an enormous margin under 20 -- and a run that reaches it is not slow,
    # it is stuck, which is a different diagnosis needing a different response. The first
    # execution of this workflow sat in the pytest step for 15 minutes with no output
    # available (logs only appear on completion), and that is exactly the failure this
    # bounds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The hub has no URL parser of its own: `hub/vendor.py` hands the job to upstream's
      # `AppleMusicURL.parse_url`, reached through `ripper_host._require_vendor_root()`,
      # which raises `RipperHostError` when `<repo>/AppleMusicDecrypt/src` is not there. So
      # without this tree every test that posts a URL to /api/jobs fails -- 72 of them, plus
      # one more that needs `config.example.toml` and one expecting a different error, for 74
      # failures in a suite that is otherwise green. The repository cannot carry the tree:
      # `.dockerignore` and `.gitignore` both exclude it, so a fresh clone -- which is what a
      # runner gets -- has none, and this is the difference between the 647 that pass on a
      # laptop with a checkout and what CI actually sees.
      #
      # The pins are read out of the Dockerfile rather than restated here, so moving one stays
      # a single edit and CI cannot be left validating a commit other than the one the image
      # will contain. The pair is the Dockerfile's own pair, for the reason that file records:
      # GitHub does not serve arbitrary SHAs over the wire (`uploadpack.allowAnySHA1InWant`),
      # so a `fetch <sha>` against a repository nobody configured fails, while a full clone
      # followed by `checkout <sha>` always works. `.gitignore` already lists
      # `AppleMusicDecrypt/`, so this leaves the working tree as clean as it found it.
      - name: vendor checkout
        run: |
          VENDOR_URL=$(grep -m1 '^ARG VENDOR_URL=' Dockerfile | cut -d= -f2-)
          VENDOR_COMMIT=$(grep -m1 '^ARG VENDOR_COMMIT=' Dockerfile | cut -d= -f2-)
          if [ -z "$VENDOR_URL" ] || [ -z "$VENDOR_COMMIT" ]; then
            echo "VENDOR_URL / VENDOR_COMMIT not found in the Dockerfile as 'ARG <name>=<value>'"
            exit 1
          fi
          git clone --quiet "$VENDOR_URL" AppleMusicDecrypt
          git -C AppleMusicDecrypt checkout --quiet "$VENDOR_COMMIT"
          # `config.toml` is untracked upstream -- it is the operator's file -- so a fresh
          # clone has only `config.example.toml`, and `hub.config` refuses to start without
          # it ("copy config.example.toml there"). The image builds it the same way for the
          # same reason, at Dockerfile:373; only the copy is needed here, because the three
          # `sed` overrides that follow in the image point paths at the container's
          # /library, which has no meaning on a runner. What the tests read off that file
          # is asserted against the Dockerfile's text, not against a running copy of it.
          cp AppleMusicDecrypt/config.example.toml AppleMusicDecrypt/config.toml

      # No `actions/setup-python`, and that is deliberate. uv installs the interpreter the
      # lockfile records, so a second tool also choosing a Python version would be a second
      # source of truth for a fact `requires-python` and `uv.lock` already own -- and the
      # two would disagree the day `requires-python` moves.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # Pinned, not left to uv's resolver, and the pin is the image's own: the Dockerfile
          # is `FROM python:3.13-slim`, and the suite was written and has always been run
          # against 3.13. Left alone uv takes the runner's `/usr/bin/python3` -- which is
          # 3.12 here, and 3.12 here means the run never ends: `asyncio.Server.close()` still
          # counts active connections as an integer, so the accepted connection in
          # `test_a_port_held_by_a_non_wrapper_fails_fast` wedges its `finally` forever and
          # the job burns its whole `timeout-minutes` at 89%. Testing a Python the image
          # does not ship would also have been the wrong thing to be green on.
          python-version: "3.13"
          enable-cache: true
          # Keyed on the one file that can invalidate this environment. A repo-wide glob
          # would also fire on a comment edit anywhere, which is a cache miss nobody asked
          # for on a job whose whole purpose is being fast.
          cache-dependency-glob: hub/uv.lock

      # `--locked` rather than a bare `uv run`. `uv run` on its own re-resolves when
      # `pyproject.toml` and `uv.lock` disagree, which turns an uncommitted dependency bump
      # into a green run against versions nobody reviewed; `--locked` fails instead, and
      # names the lockfile, which is the actionable half of the message. The difference is
      # between "the tests ran" and "the tests ran against what is committed".
      #
      # `working-directory: hub` because that is the uv project root -- the same `cd hub`
      # the README and AGENTS.md tell a human to run, so CI and a laptop agree on where the
      # suite lives.
      - name: pytest
        working-directory: hub
        run: uv run --locked pytest -q

  # The Go hub, `hub-go/`: normalize, the library scan, dedup, the job store, the
  # scheduler, the HTTP surface and the pages. Same question as the job above -- is the
  # code correct -- for the half of the program that is no longer Python.
  hub-go:
    name: hub-go (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    # The suite is seconds on a laptop -- the whole tree is this repository's own files and
    # `go test` caches aggressively -- so 15 minutes is not a speed budget, it is the same
    # bound the pytest job sets for the same reason: a run that reaches it is stuck, not
    # slow, and "stuck" needs a goroutine dump from `go test`'s own timeout (below) rather
    # than six hours of a runner doing nothing.
    timeout-minutes: 15
    strategy:
      # Both toolchains report even when one fails: "1.20 broke" and "1.22 broke" are
      # different diagnoses and the second half of the matrix is wasted if it is cancelled
      # before it can say which.
      fail-fast: false
      matrix:
        # Two toolchains, and the pair is the point. `1.22.x` is the one the image compiles
        # with -- the Dockerfile's `hub-build` stage is `FROM golang:1.22-bookworm` -- and
        # being green on some other version would be green about a binary nobody ships.
        # `1.20.x` is the floor `go.mod` states, and keeping it green is what stops a newer
        # stdlib function or builtin from creeping in: `min` made it into one of these tests
        # once, and this is the matrix entry that would have caught it.
        go-version: ["1.20.x", "1.22.x"]
    # The environment AGENTS.md documents for working on this tree, so CI and a laptop
    # cannot disagree about how it builds. `GOPROXY: off` is the strictest of the four: the
    # module has zero third-party dependencies and that is a property, not an accident --
    # the image builds the same way -- so a future accidental import fails here instead of
    # quietly resolving from the network.
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -mod=mod
      GOPROXY: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          # No dependency cache, because there are no dependencies: `go.mod` has no
          # `require` block and nothing is fetched to key one on. The build is this
          # repository's own thirty-odd files and recompiles from scratch in seconds.
          cache: false

      # `internal/sqlite` links the runtime library by its exact soname -- the binding's
      # `#cgo LDFLAGS: -l:libsqlite3.so.0` -- and carries its own minimal `sqlite3_min.h`,
      # so `libsqlite3-0` is the whole requirement and the `-dev` package is never needed.
      # Installed rather than assumed from the runner image: what ubuntu-latest ships
      # changes under us, and a missing `libsqlite3.so.0` fails as a link error naming a
      # file nothing in the repository mentions.
      - name: libsqlite3
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: vet
        working-directory: hub-go
        run: go vet ./...

      # The same command AGENTS.md gives a human. It runs the golden comparison against
      # `testdata/golden` -- generated once from the Python sources by `tools/gen_golden.py`
      # and committed, which is why this job needs neither the uv environment nor the vendor
      # tree the pytest job above has to fetch -- the job store's semantics against a real
      # SQLite database, and the HTTP contract, the scheduler and the rendered pages against
      # `httptest`. No benchmarks: `go test` will not run them without `-bench`, and a
      # timing number on a shared runner is noise.
      - name: test
        working-directory: hub-go
        run: go test ./... -timeout 5m

      # The entry point the image's `CMD` runs. `go test` compiles every package but links
      # them as a test binary; what the container needs is `amdhub`, and the cgo link
      # through `main` is not the same link.
      - name: build the binary the image ships
        working-directory: hub-go
        run: go build -trimpath -o /tmp/amdhub ./cmd/amdhub
